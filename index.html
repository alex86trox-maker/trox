<style>
/* ═══ GUEKA IDEAS · ESTUDIO (marfil·verde·oro) ═══ */
*{margin:0;padding:0;box-sizing:border-box}
:root{--e-bg:#f6f7f4;--e-panel:#fff;--e-line:#e4e8e2;--e-ink:#16211b;--e-mut:#6d7a72;--e-green:#1e4d38;--e-gold:#b89b5e;--e-sage:#eef1ec;--e-red:#a3403f;--fd:'Marcellus',Georgia,serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--fs:'Great Vibes',cursive;--sh:0 22px 55px rgba(22,33,27,.10)}
html,body{height:100%}
body{font-family:var(--fb);background:var(--e-bg);color:var(--e-ink);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--e-line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:30}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:38px}
.brand-text strong{font-family:var(--fd);letter-spacing:.14em;font-size:14px;color:var(--e-green)}
.brand-text span{display:block;font-size:8px;letter-spacing:.3em;color:var(--e-gold);text-transform:uppercase}
.proj-wrap{display:flex;align-items:center;gap:6px}
.proj-select{background:#fff;border:1px solid var(--e-line);border-radius:8px;font:inherit;font-size:11px;padding:7px 9px;max-width:140px;cursor:pointer}
.proj-btn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--e-line);border-radius:7px;background:#fff;color:var(--e-mut);cursor:pointer;font-size:12px}
.tpl-select{background:#fff;border:1px solid var(--e-gold);border-radius:8px;font:inherit;font-size:11px;padding:7px 9px;max-width:170px;cursor:pointer}
.event-pill{display:flex;align-items:center;gap:7px;padding:6px 14px;border:1px solid var(--e-line);border-radius:999px;font-size:11px;color:var(--e-green);background:var(--e-sage);font-weight:600;white-space:nowrap}
.plan-top-pill{cursor:pointer}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-dot{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--e-mut)}
.save-dot i{width:7px;height:7px;border-radius:50%;background:var(--e-green)}
.save-dot.saving i{background:var(--e-gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.btn{font:inherit;font-size:11px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--e-line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.solid{background:var(--e-green);color:#fff;border-color:var(--e-green)}
.workspace{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.preview-wrap{position:relative;overflow:hidden;background:radial-gradient(720px 520px at 18% 8%,rgba(184,155,94,.1),transparent 60%),#eef1ec}
#preview-scroll{position:absolute;inset:0;overflow-y:auto}
#preview-stage{width:430px;max-width:100%;margin:0 auto}
.sidebar{overflow-y:auto;border-left:1px solid var(--e-line);background:#fbfcfa}
.panel-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:11px;padding:14px 18px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--e-line)}
.panel-head strong{font-family:var(--fd);font-size:13px;letter-spacing:.14em;color:var(--e-green)}
.ph-count{margin-left:auto;font-size:9px;color:var(--e-mut);padding:4px 9px;border:1px solid var(--e-line);border-radius:999px}
.panel-toolbar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--e-line)}
.panel-toolbar-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ptb{padding:7px 4px;background:#fff;border:1px solid var(--e-line);border-radius:9px;font-size:9px;font-weight:600;cursor:pointer;text-align:center}
.plan-bar{padding:12px 14px;border-bottom:1px solid var(--e-line);background:#fff}
.plan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.plan-card{border:1px solid var(--e-line);border-radius:12px;padding:10px 6px;background:#fff;cursor:pointer;text-align:center;font:inherit}
.plan-card.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.sec{border-bottom:1px solid var(--e-line)}
.sec-head{width:100%;display:flex;align-items:center;gap:11px;padding:14px 18px;background:none;border:0;cursor:pointer;font:inherit;text-align:left}
.sec-num{font-family:var(--fd);font-size:12px;color:var(--e-gold)}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.sec-head .chev{margin-left:auto;transition:transform .3s}
.sec.open .chev{transform:rotate(180deg)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-inner{overflow:hidden}
.sec-pad{padding:6px 18px 18px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--e-mut);margin-bottom:6px}
.in{width:100%;font:inherit;font-size:12px;background:#fff;border:1px solid var(--e-line);border-radius:9px;padding:9px 11px}
textarea.in{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tog-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.sw{position:relative;width:38px;height:22px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:#d5ddd3}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.28s}
.sw input:checked + i{background:var(--e-green)}
.sw input:checked + i::after{left:19px}
.list-row{position:relative;border:1px solid var(--e-line);border-radius:10px;padding:10px 40px 10px 10px;margin-bottom:9px;background:#fff}
.list-row .in{margin-bottom:7px}
.list-del{position:absolute;top:7px;right:7px;width:22px;height:22px;border:0;border-radius:6px;cursor:pointer;background:#f8efee;color:var(--e-red)}
.list-add{width:100%;font:inherit;font-size:10px;font-weight:700;padding:9px;border:1px dashed rgba(184,155,94,.6);border-radius:9px;background:rgba(184,155,94,.06);color:var(--e-gold);cursor:pointer}
.photo-field{margin-bottom:14px}
.photo-field>label{display:block;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--e-mut);margin-bottom:6px}
.photo-preview-wrap{position:relative;width:100%;height:80px;border-radius:10px;overflow:hidden;margin-bottom:6px;border:1px solid var(--e-line);background:var(--e-sage)}
.photo-preview-wrap img{width:100%;height:100%;object-fit:cover;object-position:top}
.photo-tools{display:flex;gap:6px;margin-top:6px}
.photo-tool{flex:1;font-size:9px;padding:6px;border-radius:7px;cursor:pointer;border:1px solid var(--e-line);background:#fff;font-weight:600}
.db-status{font-size:9px;color:var(--e-green);margin-top:6px;font-weight:600}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pal-card{border:1px solid var(--e-line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.pal-card.sel{border-color:var(--e-green);box-shadow:0 0 0 1px var(--e-green)}
.pal-dots{display:flex;gap:4px;margin-bottom:8px}
.pal-dots i{width:14px;height:14px;border-radius:50%}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--e-ink);border:1px solid var(--e-gold);color:#fff;font-size:12px;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.35s}
.toast.show{opacity:1;transform:none}
/* ═══ TARJETA (temas) ═══ */
#card-wrapper{--c-bg:#080810;--c-text:#fff;--c-dim:rgba(255,255,255,.45);--c-line:rgba(255,255,255,.1);--c-a:#ff0050;--c-b:#00f2ea;--c-c:#ffd700;--c-d:#39ff14;--c-e:#bf00ff;--c-head:'Montserrat',sans-serif;--c-serif:'Noto Serif',serif;--c-mono:'JetBrains Mono',monospace;--c-script:'Great Vibes',cursive;max-width:430px;margin:0 auto;background:var(--c-bg);color:var(--c-text);font-family:var(--c-head)}
#card-wrapper[data-theme="elegante"]{--c-bg:#0f1712;--c-a:#b89b5e;--c-b:#8fb39c;--c-c:#e8dcc0;--c-d:#cdb079;--c-e:#9db8a4;--c-head:'Marcellus',serif;--c-serif:'Marcellus',serif;--c-mono:'Figtree',sans-serif}
#card-wrapper[data-theme="pastel"]{--c-bg:#f8f6f1;--c-text:#16211b;--c-dim:rgba(22,33,27,.5);--c-line:rgba(22,33,27,.12);--c-a:#b89b5e;--c-b:#7fa08c;--c-c:#8a6d3b;--c-d:#5c7a68;--c-e:#a3803e;--c-head:'Marcellus',serif;--c-serif:'Marcellus',serif;--c-mono:'Figtree',sans-serif}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c-bg);cursor:pointer}
.splash-15{font-size:6rem;font-weight:900;text-shadow:3px 3px 0 var(--c-b),-3px -3px 0 var(--c-a)}
.splash-name{font-family:var(--c-script);font-size:1.9rem}
.splash-date{font-family:var(--c-mono);font-size:.6rem;letter-spacing:.2em;color:var(--c-dim)}
.splash-btn{margin-top:28px;font-weight:700;padding:12px 30px;background:linear-gradient(135deg,var(--c-a),var(--c-b));color:var(--c-bg);border:none;border-radius:99px}
#card-wrapper section{padding:48px 20px;text-align:center}
#card-wrapper h2{font-weight:900;font-size:1.7rem;letter-spacing:.1em;margin-bottom:18px}
.cover-img{width:100%;height:420px;object-fit:cover;object-position:top}
.gal-prev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal-prev img{width:100%;height:120px;object-fit:cover;border-radius:8px}
@media(max-width:1024px){.workspace{display:block}.sidebar{position:absolute;top:0;bottom:0;right:0;width:min(400px,92vw);transform:translateX(100%);transition:.35s;z-index:200}.sidebar.mob-open{transform:none}.preview-wrap{position:absolute;inset:0}}
@media print{.sidebar,.topbar,.toasts{display:none!important}body{overflow:visible}.workspace{display:block}.preview-wrap{position:static;overflow:visible}}
</style>
</head>

<div class="brand"><img class="brand-logo" src="https://hercules-cdn.com/file_GksORuRQPAzOYyo4c4ClTi44" alt="Gueka Ideas"><div class="brand-text"><strong>GUEKA IDEAS</strong><span>estudio de invitaciones</span></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad=n=>String(n).padStart(2,'0');
function toast(h){const t=document.createElement('div');t.className='toast';t.innerHTML=h;$('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},2700);}

/* ════════════════════════════════════════════════════════════
   📦 CONFIGURACIÓN DE LA BASE DE DATOS LOCAL (IndexedDB)
   Adaptada al editor anterior SIN modificar las demás funciones
════════════════════════════════════════════════════════════ */
const DB_NAME="GuekaEditorDB", DB_VERSION=1, STORE_NAME="fotos_proyecto";
let db=null;
function inicializarBaseDatosLocal(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onerror=(e)=>{console.error("Error al abrir IndexedDB:",e.target.error);reject(e.target.error);};
    request.onsuccess=(e)=>{db=e.target.result;resolve(db);};
    request.onupgradeneeded=(e)=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME,{keyPath:"id"});
    };
  });
}
function guardarFotoLocal(idFoto,fileBlob){
  return new Promise((resolve,reject)=>{
    if(!db)return reject("Base de datos no inicializada.");
    const tx=db.transaction([STORE_NAME],"readwrite");
    const store=tx.objectStore(STORE_NAME);
    store.put({id:idFoto,blob:fileBlob,fecha:Date.now()});
    tx.oncomplete=()=>resolve(true);
    tx.onerror=(e)=>reject(e.target.error);
  });
}
function obtenerFotosLocales(){
  return new Promise((resolve,reject)=>{
    if(!db)return reject("Base de datos no inicializada.");
    const req=db.transaction([STORE_NAME],"readonly").objectStore(STORE_NAME).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=(e)=>reject(e.target.error);
  });
}

/* ═══ ESTADO (las 15 casillas anteriores intactas) ═══ */
const PLANS={classic:{name:'CLASSIC',price:80000,maxGal:4,color:'#6d7a72'},premium:{name:'PREMIUM',price:140000,maxGal:8,color:'#b89b5e'},deluxe:{name:'DELUXE',price:200000,maxGal:12,color:'#1e4d38'}};
const PALETTES={neon:{a:'#ff0050',b:'#00f2ea',c:'#ffd700',d:'#39ff14',e:'#bf00ff',bg:'#080810'},violeta:{a:'#c026d3',b:'#8b5cf6',c:'#f0abfc',d:'#22d3ee',e:'#e879f9',bg:'#0a0612'},dorado:{a:'#b89b5e',b:'#8fb39c',c:'#e8dcc0',d:'#cdb079',e:'#9db8a4',bg:'#0f1712'},oceano:{a:'#22d3ee',b:'#38bdf8',c:'#a5f3fc',d:'#2dd4bf',e:'#818cf8',bg:'#060a12'}};
function makeDefaults(){return{plan:'classic',category:'quince',templateName:'',name:'Sofía Valentina',age:'15',date:'2026-06-20',time:'18:30',hashtag:'#SofíaValentinaXV',caption:'✨ Mi gran noche llega...',historyText:'Sofía Valentina nació el 20 de junio de 2011.',venue:'SALÓN DE EVENTOS',address:'Calle de los Sueños 123, Bogotá',waOrganizer:'',rsvpCapacity:0,poem:'Hoy comienzas a escribir\nel capítulo más hermoso.',signature:'Con amor, Sofía',palette:'neon',showSplash:true,splashBtn:'▶ ABRIR INVITACIÓN',itinerary:[{time:'6:30 PM',name:'RECEPCIÓN'},{time:'8:00 PM',name:'VALS'}],padrinos:[{cat:'VALS',name:'Familia Rodríguez'}],dressCode:[{title:'DAMAS',desc:'Vestido largo'}],extra:[{icon:'📸',title:'FOTÓGRAFO',body:'Fotógrafo toda la noche'}],songs:[{title:'Vals Op.64 No.1',src:''}],gifts:[{label:'NEQUI',sub:'Colombia'}],captions:{},imgs:{retrato:'',fashion:''},gal:[]};}
let state=makeDefaults();
try{const s=localStorage.getItem('gueka_editor_v2');if(s)state=Object.assign(makeDefaults(),JSON.parse(s));}catch(e){}
function markSave(){const d=$('#saveDot');d.classList.add('saving');clearTimeout(markSave.t);markSave.t=setTimeout(()=>{try{localStorage.setItem('gueka_editor_v2',JSON.stringify(state));}catch(e){}d.classList.remove('saving');},600);}

/* ═══ RENDER VISTA PREVIA (sin tocar otras funciones) ═══ */
function renderPreview(){
$('#sp-15').textContent=state.age;$('#sp-name').textContent=state.name;$('#sp-btn').textContent=state.splashBtn;
const d=new Date(state.date+'T'+(state.time||'18:30'));$('#sp-date').textContent=d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
$('#pv-nombre').textContent=state.name;
$('#pv-retrato').src=state.imgs.retrato||'https://image.qwenlm.ai/public_source/501fff7f-a609-4843-af5b-2ac3bc956c88/119aaf951-991f-48f5-bce6-7cf6bf499e4a.png';
$('#pv-lugar').innerHTML=esc(state.venue)+'<br>'+esc(state.address);
$('#pv-rsvp').textContent='WA: '+state.waOrganizer+' · Aforo: '+(state.rsvpCapacity||'∞');
const g=$('#pv-galeria');g.innerHTML='';(state.gal||[]).slice(0,PLANS[state.plan].maxGal).forEach(u=>{const im=document.createElement('img');im.src=u;g.appendChild(im);});
const cw=$('#card-wrapper');cw.dataset.theme=({quince:'neon',matrimonio:'elegante',bautizo:'pastel',comunion:'pastel',graduacion:'elegante',empresarial:'elegante',cumpleanos:'neon',infantiles:'pastel'})[state.category]||'neon';
const P=PALETTES[state.palette]||PALETTES.neon;cw.style.setProperty('--c-a',P.a);cw.style.setProperty('--c-b',P.b);cw.style.setProperty('--c-c',P.c);cw.style.setProperty('--c-d',P.d);cw.style.setProperty('--c-e',P.e);cw.style.setProperty('--c-bg',P.bg);
}
setInterval(()=>{const t=new Date(state.date+'T'+(state.time||'18:30'))-Date.now();if(t<0)t=0;const dd=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4),s=Math.floor(t%6e4/1e3);const c=$('#cd');if(c)c.textContent=pad(dd)+':'+pad(h)+':'+pad(m)+':'+pad(s);},1000);

/* ═══ PLANES / SELECTORES ═══ */
function renderPlans(){const c=$('#planCards');c.innerHTML='';Object.keys(PLANS).forEach(k=>{const p=PLANS[k];const b=document.createElement('button');b.className='plan-card'+(k===state.plan?' sel':'');b.style.setProperty('--pc',p.color);b.innerHTML='<div class="n">'+p.name+'</div><div class="pr">$'+(p.price/1000)+'K</div><div class="g">📷 '+p.maxGal+'</div>';b.onclick=()=>{state.plan=k;renderPlans();renderPreview();markSave();};c.appendChild(b);});$('#planPillTxt').textContent='PLAN '+PLANS[state.plan].name;}
function buildSelectors(){$('#tplSelect').innerHTML=['quince','matrimonio','bautizo','comunion','cumpleanos','graduacion','infantiles','empresarial'].map(c=>'<option value="'+c+'">'+c+'</option>').join('');$('#tplSelect').value=state.category;$('#tplSelect').onchange=e=>{state.category=e.target.value;renderPreview();markSave();};}
function buildPalette(){const g=$('#palette-grid');g.innerHTML='';Object.keys(PALETTES).forEach(k=>{const P=PALETTES[k];const b=document.createElement('button');b.className='pal-card'+(k===state.palette?' sel':'');b.innerHTML='<div class="pal-dots"><i style="background:'+P.a+'"></i><i style="background:'+P.b+'"></i><i style="background:'+P.c+'"></i></div>';b.onclick=()=>{state.palette=k;buildPalette();renderPreview();markSave();};g.appendChild(b);});}
function buildLists(){
const mk=(id,key,fields,add)=>{const c=$(id);if(!c)return;c.innerHTML='';state[key].forEach((it,i)=>{const r=document.createElement('div');r.className='list-row';fields.forEach(f=>{const inp=document.createElement('input');inp.className='in';inp.placeholder=f;inp.value=it[Object.keys(it)[0]]||'';inp.oninput=()=>{it[Object.keys(it)[0]]=inp.value;markSave();};r.appendChild(inp);});const del=document.createElement('button');del.className='list-del';del.textContent='✕';del.onclick=()=>{state[key].splice(i,1);buildLists();markSave();};r.appendChild(del);c.appendChild(r);});const a=document.createElement('button');a.className='list-add';a.textContent='+ '+add;a.onclick=()=>{state[key].push({});buildLists();markSave();};c.appendChild(a);};
mk('#ed-itin','itinerary',['Hora / Nombre'],'momento');
mk('#ed-padr','padrinos',['Categoría / Nombre'],'padrino');
mk('#ed-dress','dressCode',['Título / Descripción'],'ítem');
mk('#ed-extra','extra',['Emoji / Título'],'ítem');
mk('#ed-songs','songs',['Título'],'canción');
mk('#ed-gifts','gifts',['Método'],'método');
const g=$('#ed-gal');g.innerHTML='';(state.gal||[]).forEach((u,i)=>{const r=document.createElement('div');r.className='list-row';const inp=document.createElement('input');inp.className='in';inp.value=u;inp.oninput=()=>{state.gal[i]=inp.value;renderPreview();markSave();};r.appendChild(inp);const del=document.createElement('button');del.className='list-del';del.textContent='✕';del.onclick=()=>{state.gal.splice(i,1);buildLists();renderPreview();markSave();};r.appendChild(del);g.appendChild(r);});
}

/* ═══ BIND de las 15 casillas (sin modificar) ═══ */
$$('[data-bind]').forEach(el=>{el.addEventListener('input',()=>{const k=el.dataset.bind;state[k]=el.type==='checkbox'?el.checked:el.value;renderPreview();markSave();});});
$$('.sec-head').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('open')));

/* ═══ SUBIDA DE FOTOS → IndexedDB (adaptada) ═══ */
async function restaurarFotos(){
try{
await inicializarBaseDatosLocal();
$('#dbStatus').textContent='✓ Conexión exitosa a IndexedDB (GuekaEditorDB)';
const fotos=await obtenerFotosLocales();
if(fotos&&fotos.length){state.gal=state.gal||[];fotos.slice(0,PLANS[state.plan].maxGal).forEach(f=>{const url=URL.createObjectURL(f.blob);if(!state.gal.includes(url))state.gal.push(url);});renderPreview();}
}catch(e){$('#dbStatus').textContent='⚠ IndexedDB no disponible';}
}
document.getElementById("cantidad_fotos").addEventListener("change",async(ev)=>{
const archivos=Array.from(ev.target.files);if(!archivos.length)return;
const max=PLANS[state.plan].maxGal;
if((state.gal||[]).length+archivos.length>max){toast('⚠ Tu plan '+PLANS[state.plan].name+' permite máximo '+max+' fotos');ev.target.value='';return;}
for(let i=0;i<archivos.length;i++){
const archivo=archivos[i];
const idUnico='foto_'+Date.now()+'_'+i;
await guardarFotoLocal(idUnico,archivo);
const urlPreviewLocal=URL.createObjectURL(archivo);
state.gal=state.gal||[];state.gal.push(urlPreviewLocal);
}
renderPreview();markSave();restaurarFotos();
toast('✨ Fotos guardadas en IndexedDB');
ev.target.value='';
});
$$('.photo-tool[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up;const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const id='foto_'+k+'_'+Date.now();await guardarFotoLocal(id,f);const url=URL.createObjectURL(f);state.imgs[k]=url;$('#prev-'+k).src=url;renderPreview();markSave();toast('✓ Foto guardada en IndexedDB');};fi.click();});
$$('.photo-tool[data-def]').forEach(b=>b.onclick=()=>{const k=b.dataset.def;state.imgs[k]='';renderPreview();markSave();});

/* ═══ EXPORT / RESET / UNDO (funciones anteriores intactas) ═══ */
$('#btnExport').onclick=$('#btnExport2').onclick=()=>{const html=document.documentElement.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='invitacion.html';a.click();toast('✓ HTML descargado');};
$('#btnResetAll').onclick=()=>{state=makeDefaults();renderPreview();renderPlans();buildLists();markSave();toast('Restablecido');};
$('#btnUndo').onclick=()=>toast('↺ Deshacer');$('#btnRedo').onclick=()=>toast('↻ Rehacer');
$('#btnQR').onclick=()=>{if(typeof QRCode!=='undefined'){const w=window.open('','_blank');w.document.write('<div id="q"></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"),{text:"https://guekaideas.com/invitacion",width:200,height:200});<\/script>');} };
$('#btnImport').onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{state=Object.assign(makeDefaults(),JSON.parse(e.target.result));renderPreview();renderPlans();buildLists();markSave();toast('✓ Importado');}catch(e){toast('⚠ Archivo no válido');}};r.readAsText(f);};

renderPlans();buildSelectors();buildPalette();buildLists();renderPreview();restaurarFotos();
</script>

<style>
/* ═══ GUEKA IDEAS · ESTUDIO — marfil·verde·oro (compacto) ═══ */
*{margin:0;padding:0;box-sizing:border-box}
:root{--e-bg:#f6f7f4;--e-panel:#fff;--e-line:#e4e8e2;--e-ink:#16211b;--e-mut:#6d7a72;--e-green:#1e4d38;--e-gold:#b89b5e;--e-sage:#eef1ec;--e-red:#a3403f;--fd:'Marcellus',Georgia,serif;--fb:'Figtree',system-ui,sans-serif;--sh:0 22px 55px rgba(22,33,27,.10)}
html,body{height:100%}
body{font-family:var(--fb);background:var(--e-bg);color:var(--e-ink);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--e-line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:30}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:38px}
.brand-text strong{font-family:var(--fd);letter-spacing:.14em;font-size:14px;color:var(--e-green)}
.brand-text span{display:block;font-size:8px;letter-spacing:.3em;color:var(--e-gold);text-transform:uppercase}
.sel,.proj-select,.tpl-select{background:#fff;border:1px solid var(--e-line);border-radius:8px;font:inherit;font-size:11px;padding:7px 9px;max-width:160px;cursor:pointer}
.tpl-select{border-color:var(--e-gold)}
.event-pill{display:flex;align-items:center;gap:7px;padding:6px 14px;border:1px solid var(--e-line);border-radius:999px;font-size:11px;color:var(--e-green);background:var(--e-sage);font-weight:600;white-space:nowrap}
.plan-top-pill{cursor:pointer}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-dot{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--e-mut)}
.save-dot i{width:7px;height:7px;border-radius:50%;background:var(--e-green)}
.btn{font:inherit;font-size:11px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--e-line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.solid{background:var(--e-green);color:#fff;border-color:var(--e-green)}
.workspace{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.preview-wrap{position:relative;overflow:hidden;background:radial-gradient(700px 500px at 20% 10%,rgba(184,155,94,.1),transparent 60%),#eef1ec}
#preview-scroll{position:absolute;inset:0;overflow-y:auto}
#preview-stage{width:430px;max-width:100%;margin:0 auto;transform-origin:top center}
.sidebar{overflow-y:auto;border-left:1px solid var(--e-line);background:#fbfcfa}
.panel-head{position:sticky;top:0;z-index:5;padding:14px 18px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--e-line)}
.panel-head strong{font-family:var(--fd);font-size:13px;letter-spacing:.14em;color:var(--e-green)}
.panel-toolbar{padding:10px 14px;background:#fff;border-bottom:1px solid var(--e-line)}
.panel-toolbar-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ptb{padding:7px 4px;background:#fff;border:1px solid var(--e-line);border-radius:9px;font-size:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.plan-bar{padding:12px 14px;border-bottom:1px solid var(--e-line);background:#fff}
.plan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.plan-card{border:1px solid var(--e-line);border-radius:12px;padding:10px 6px;background:#fff;cursor:pointer;text-align:center;font:inherit}
.plan-card.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.sec{border-bottom:1px solid var(--e-line)}
.sec-head{width:100%;display:flex;align-items:center;gap:11px;padding:15px 18px;background:none;border:0;cursor:pointer;font:inherit;text-align:left}
.sec-num{font-family:var(--fd);font-size:12px}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-inner{overflow:hidden}
.sec-pad{padding:6px 18px 20px}
.sec.locked .sec-body{display:none!important}
.sec-lock-badge{margin-left:auto;font-size:7.5px;padding:3px 8px;border-radius:999px;border:1px solid;font-weight:700}
.field{margin-bottom:12px}
.field>label{display:block;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--e-mut);margin-bottom:6px}
.in{width:100%;font:inherit;font-size:12px;background:#fff;border:1px solid var(--e-line);border-radius:9px;padding:9px 11px}
textarea.in{resize:vertical;min-height:52px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.list-row{position:relative;border:1px solid var(--e-line);border-radius:10px;padding:10px 40px 10px 10px;margin-bottom:9px;background:#fff}
.list-row .in{margin-bottom:7px}
.list-del{position:absolute;top:7px;right:7px;width:22px;height:22px;border:0;border-radius:6px;cursor:pointer;background:#f8efee;color:var(--e-red)}
.list-add{width:100%;font:inherit;font-size:10px;font-weight:700;padding:9px;border:1px dashed rgba(184,155,94,.6);border-radius:9px;color:var(--e-gold);cursor:pointer}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pal-card{border:1px solid var(--e-line);border-radius:10px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.pal-card.sel{border-color:var(--e-green);box-shadow:0 0 0 1px var(--e-green)}
.pal-dots{display:flex;gap:4px;margin-bottom:8px}
.pal-dots i{width:14px;height:14px;border-radius:50%}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--e-ink);border:1px solid var(--e-gold);color:#fff;font-size:12px;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.35s}
.toast.show{opacity:1;transform:none}
/* ═══ TARJETA (temas) ═══ */
#card-wrapper{--c-bg:#080810;--c-text:#fff;--c-dim:rgba(255,255,255,.45);--c-line:rgba(255,255,255,.1);--c-a:#ff0050;--c-b:#00f2ea;--c-c:#ffd700;--c-d:#39ff14;--c-e:#bf00ff;--c-head:'Montserrat',sans-serif;--c-serif:'Noto Serif',serif;--c-mono:'JetBrains Mono',monospace;--c-script:'Great Vibes',cursive;max-width:430px;margin:0 auto;background:var(--c-bg);color:var(--c-text);font-family:var(--c-head)}
#card-wrapper[data-theme="elegante"]{--c-bg:#0f1712;--c-a:#b89b5e;--c-b:#8fb39c;--c-c:#e8dcc0;--c-d:#cdb079;--c-e:#9db8a4;--c-text:#f5f2ea;--c-dim:rgba(245,242,234,.5);--c-line:rgba(245,242,234,.14);--c-head:'Marcellus',serif;--c-serif:'Marcellus',serif;--c-mono:'Figtree',sans-serif}
#card-wrapper[data-theme="pastel"]{--c-bg:#f8f6f1;--c-text:#16211b;--c-dim:rgba(22,33,27,.5);--c-line:rgba(22,33,27,.12);--c-a:#b89b5e;--c-b:#7fa08c;--c-c:#8a6d3b;--c-d:#5c7a68;--c-e:#a3803e;--c-head:'Marcellus',serif;--c-serif:'Marcellus',serif;--c-mono:'Figtree',sans-serif}
#card-wrapper section{padding:48px 20px;text-align:center}
#card-wrapper h2{font-family:var(--c-head);font-weight:900;font-size:1.6rem;letter-spacing:.1em;margin-bottom:18px}
#card-wrapper .lbl{font-family:var(--c-mono);font-size:.6rem;letter-spacing:.3em;color:var(--c-dim)}
#card-wrapper img.cover{width:100%;height:420px;object-fit:cover;object-position:top}
#card-wrapper .big{font-family:var(--c-script);font-size:2.4rem}
#card-wrapper .mono{font-family:var(--c-mono);font-size:.7rem;color:var(--c-dim)}
@media(max-width:1024px){.workspace{display:block}.sidebar{position:absolute;top:0;bottom:0;right:0;width:min(400px,92vw);transform:translateX(100%);transition:.35s;z-index:200}.sidebar.mob-open{transform:none}}
</style>
</head>
<body>

<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const IS_EDITOR=!!$('#sidebar');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const pad=n=>String(n).padStart(2,'0');
const slugify=s=>(s||'xv').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'xv';
const IMG_BASE='https://image.qwenlm.ai/public_source/9a965b8a-caf8-4a45-bb09-dce792791ca0/';
const IMG_BASE2='https://image.qwenlm.ai/public_source/501fff7f-a609-4843-af5b-2ac3bc956c88/';
const TEMPLATES={
matrimonio:{label:'Matrimonio',age:'',ageSuffix:'',templates:[{slug:'cinema-boda',nombre:'Cinema Boda',img:IMG_BASE+'16390c866-cf9c-4673-b634-bc757d72bf2d.png',palette:'dorado'},{slug:'jardin-romantico',nombre:'Jardín Romántico',img:IMG_BASE+'169abf264-8e77-4601-a1f7-186006cf7708.png',palette:'violeta'}]},
quince:{label:'15 Años',age:'15',ageSuffix:'AÑOS',templates:[{slug:'xv-tiktok-neon',nombre:'XV TikTok Neón',img:IMG_BASE2+'119aaf951-991f-48f5-bce6-7cf6bf499e4a.png',palette:'neon'},{slug:'xv-rosas',nombre:'XV Rosas',img:IMG_BASE+'15b3f35d7-f141-4673-8e5f-08fbf8765a28.png',palette:'violeta'}]},
bautizo:{label:'Bautizo',age:'1',ageSuffix:'AÑO',templates:[{slug:'angel-celeste',nombre:'Ángel Celeste',img:IMG_BASE+'193c73c47-3a8a-4be4-a87d-92bad916f2b0.png',palette:'oceano'}]},
comunion:{label:'Comunión',age:'9',ageSuffix:'AÑOS',templates:[{slug:'primera-comunion',nombre:'Primera Comunión',img:IMG_BASE+'1aad1538a-a980-4d8d-8ded-98d749ff70cf.png',palette:'oceano'}]},
cumpleanos:{label:'Cumpleaños',age:'30',ageSuffix:'AÑOS',templates:[{slug:'fiesta-de-lujo',nombre:'Fiesta de Lujo',img:IMG_BASE+'1a21d1b81-6c24-42f0-9437-4c69b35f38f7.png',palette:'dorado'}]},
graduacion:{label:'Graduación',age:'22',ageSuffix:'AÑOS',templates:[{slug:'toga-y-birrete',nombre:'Toga & Birrete',img:IMG_BASE+'193c73c47-3a8a-4be4-a87d-92bad916f2b0.png',palette:'dorado'}]},
infantiles:{label:'Infantiles',age:'5',ageSuffix:'AÑOS',templates:[{slug:'mundo-unicornios',nombre:'Mundo de Unicornios',img:IMG_BASE+'193c73c47-3a8a-4be4-a87d-92bad916f2b0.png',palette:'violeta'}]},
empresarial:{label:'Empresarial',age:'',ageSuffix:'',templates:[{slug:'brand-launch',nombre:'Brand Launch',img:IMG_BASE+'188417c74-5dd4-4216-b950-5824464e8cf1.png',palette:'oceano'}]}
};
const CAT_THEME={matrimonio:'elegante',quince:'neon',bautizo:'pastel',comunion:'pastel',cumpleanos:'fiesta',graduacion:'academico',infantiles:'fiesta',empresarial:'elegante'};
const PLAN_ORDER=['classic','premium','deluxe'];
const PLANS={classic:{name:'CLASSIC',price:'$80.000',color:'#6d7a72',maxGal:4},premium:{name:'PREMIUM',price:'$140.000',color:'#b89b5e',maxGal:8},deluxe:{name:'DELUXE',price:'$200.000',color:'#1e4d38',maxGal:12}};
const PLAN_REQ={history:'premium',itinerary:'premium',rsvp:'premium',location:'deluxe'};
const PALETTES={neon:{name:'NEÓN',pink:'#ff0050',cyan:'#00f2ea',gold:'#ffd700',green:'#39ff14',purple:'#bf00ff',bg:'#080810'},violeta:{name:'VIOLETA',pink:'#c026d3',cyan:'#8b5cf6',gold:'#f0abfc',green:'#22d3ee',purple:'#e879f9',bg:'#0a0612'},dorado:{name:'DORADO',pink:'#b89b5e',cyan:'#8fb39c',gold:'#e8dcc0',green:'#cdb079',purple:'#9db8a4',bg:'#0f1712'},oceano:{name:'OCÉANO',pink:'#22d3ee',cyan:'#38bdf8',gold:'#a5f3fc',green:'#2dd4bf',purple:'#818cf8',bg:'#060a12'}};
const FONTS={tiktok:{name:'NEÓN',sans:"'Montserrat',sans-serif",serif:"'Noto Serif',serif",mono:"'JetBrains Mono',monospace"},elegante:{name:'ELEGANTE',sans:"'Marcellus',serif",serif:"'Marcellus',serif",mono:"'Figtree',sans-serif"},moderna:{name:'MODERNA',sans:"'Figtree',sans-serif",serif:"'Figtree',sans-serif",mono:"'Figtree',sans-serif"}};
let PAL={...PALETTES.neon};
const GAL_ORDER=['retrato','fashion','vals','pista','pastel','corte','baile','brindis','decoracion','sorpresa','amigas','final'];
function makeDefaults(){return{plan:'classic',category:'quince',categoryLabel:'15 Años',templateName:'',name:'Sofía Valentina',age:'15',ageSuffix:'AÑOS',username:'sofia.valentina.xv',date:'2026-06-20',time:'18:30',hashtag:'#SofíaValentinaXV',caption:'✨ Mi gran noche llega...',historyText:'Sofía Valentina nació el 20 de junio de 2011.',venue:'SALÓN DE EVENTOS',address:'Calle de los Sueños 123\nBogotá',mapUrl:'https://maps.google.com/maps?q=Bogot%C3%A1',waOrganizer:'',rsvpCapacity:0,itinerary:[{time:'6:30 PM',name:'RECEPCIÓN',desc:'Bienvenida'}],palette:'neon',font:'tiktok',imgs:{retrato:IMG_BASE2+'119aaf951-991f-48f5-bce6-7cf6bf499e4a.png',fashion:'',vals:'',pista:'',pastel:'',corte:'',baile:'',brindis:'',decoracion:'',sorpresa:'',amigas:'',final:''}};}
let state=makeDefaults();
const LS='gueka_editor_v2';
try{const s=localStorage.getItem(LS);if(s)state=Object.assign(makeDefaults(),JSON.parse(s));}catch(e){}
function markSave(){clearTimeout(markSave.t);markSave.t=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}const d=$('#saveDot');if(d)d.classList.remove('saving');},500);const d=$('#saveDot');if(d)d.classList.add('saving');}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},2600);}
const planLevel=p=>PLAN_ORDER.indexOf(p||state.plan);
const planHas=f=>{const r=PLAN_REQ[f];if(!r)return true;return planLevel(state.plan)>=planLevel(r);};
function applyPlanLocks(){$$('.sec[data-feat]').forEach(sec=>{const f=sec.dataset.feat;const req=PLAN_REQ[f];const locked=!planHas(f);sec.classList.toggle('locked',locked);const b=sec.querySelector('.sec-lock-badge');if(b)b.textContent=locked?('🔒 '+PLANS[req].name):('✓ '+PLANS[req].name);});}
function renderPlanUI(){const c=$('#planCards');c.innerHTML='';PLAN_ORDER.forEach(k=>{const p=PLANS[k];const b=document.createElement('button');b.type='button';b.className='plan-card'+(k===state.plan?' sel':'');b.style.setProperty('--pc',p.color);b.innerHTML='<div style="font-size:8.5px;font-weight:700">'+p.name+'</div><div style="font-size:10px;font-weight:700">'+p.price+'</div>';b.onclick=()=>{state.plan=k;fullRender();markSave();};c.appendChild(b);});$('#planPillTxt').textContent='PLAN '+PLANS[state.plan].name;}
function buildTemplateSelector(){const sel=$('#tplSelect');sel.innerHTML='';Object.keys(TEMPLATES).forEach(ck=>{const cat=TEMPLATES[ck];const og=document.createElement('optgroup');og.label=cat.label;cat.templates.forEach(t=>{const o=document.createElement('option');o.value=ck+'/'+t.slug;o.textContent=t.nombre;og.appendChild(o);});sel.appendChild(og);});sel.onchange=()=>{if(sel.value)loadTemplateByPath(sel.value);};}
function loadTemplateByPath(path){const parts=path.split('/');if(parts.length<2)return;const catKey=parts[0];const cat=TEMPLATES[catKey];if(!cat)return;const tpl=cat.templates.find(t=>t.slug===parts[1]);if(!tpl)return;applyTemplate(catKey,cat,tpl);}
/* ✔ CORREGIDO: antes usaba `catKey` sin definir dentro de applyTemplate (ReferenceError) */
function applyTemplate(catKey,cat,tpl){
state.category=catKey;
state.categoryLabel=cat.label||catKey;
state.templateName=tpl.nombre;
if(cat.age!==undefined){state.age=cat.age;state.ageSuffix=cat.ageSuffix||'';}
if(tpl.palette&&PALETTES[tpl.palette])state.palette=tpl.palette;
if(tpl.img)state.imgs.retrato=tpl.img;
const sel=$('#tplSelect');if(sel)sel.value=catKey+'/'+tpl.slug;
fullRender();markSave();
toast('✦ Plantilla: <b>'+esc(tpl.nombre)+'</b>');
}
function applyPalette(k){PAL={...PALETTES[k]||PALETTES.neon};state.palette=k;const cw=$('#card-wrapper');cw.style.setProperty('--c-a',PAL.pink);cw.style.setProperty('--c-b',PAL.cyan);cw.style.setProperty('--c-c',PAL.gold);cw.style.setProperty('--c-d',PAL.green);cw.style.setProperty('--c-e',PAL.purple);cw.style.setProperty('--c-bg',PAL.bg);}
function applyFont(k){const F=FONTS[k]||FONTS.tiktok;state.font=k;const cw=$('#card-wrapper');cw.style.setProperty('--c-head',F.sans);cw.style.setProperty('--c-serif',F.serif);cw.style.setProperty('--c-mono',F.mono);}
function buildPaletteEditor(){const g=$('#palette-grid');g.innerHTML='';Object.keys(PALETTES).forEach(k=>{const P=PALETTES[k];const b=document.createElement('button');b.type='button';b.className='pal-card'+(k===state.palette?' sel':'');b.innerHTML='<div class="pal-dots"><i style="background:'+P.pink+'"></i><i style="background:'+P.cyan+'"></i><i style="background:'+P.gold+'"></i></div><div style="font-size:9.5px;font-weight:600">'+P.name+'</div>';b.onclick=()=>{applyPalette(k);fullRender();markSave();};g.appendChild(b);});}
function buildFontEditor(){const g=$('#font-grid');if(!g)return;g.innerHTML='';Object.keys(FONTS).forEach(k=>{const F=FONTS[k];const b=document.createElement('button');b.type='button';b.className='pal-card'+(k===state.font?' sel':'');b.innerHTML='<div style="font-family:'+F.sans+';font-size:1.1rem">'+F.name+'</div>';b.onclick=()=>{applyFont(k);fullRender();markSave();};g.appendChild(b);});}
function buildGalFields(){const h=$('#gal-fields');h.innerHTML='';GAL_ORDER.slice(0,PLANS[state.plan].maxGal).forEach(k=>{const f=document.createElement('div');f.className='field';f.innerHTML='<label>'+k+'</label><input class="in" type="url" data-gal="'+k+'" value="'+esc(state.imgs[k]||'')+'">';h.appendChild(f);});}
function bindInputs(){$$('[data-bind]').forEach(el=>{el.addEventListener('input',()=>{state[el.dataset.bind]=el.value;renderStatic();markSave();});});$$('[data-gal]').forEach(el=>{el.addEventListener('input',()=>{state.imgs[el.dataset.gal]=el.value;renderStatic();markSave();});});}
function renderStatic(){$('#pv-name').textContent=state.name;$('#pv-date').textContent=state.date+' '+state.time;$('#pv-fecha').textContent=state.date+' · '+state.time;$('#pv-hist').textContent=state.historyText;$('#pv-lugar').textContent=state.venue+' · '+state.address;const r=$('#pv-retrato');if(r&&state.imgs.retrato)r.src=state.imgs.retrato;applyPalette(state.palette);applyFont(state.font);const cw=$('#card-wrapper');cw.dataset.theme=CAT_THEME[state.category]||'elegante';}
function buildListEditor(id,key,fields,add){const c=$(id);if(!c)return;c.innerHTML='';state[key].forEach((item,i)=>{const row=document.createElement('div');row.className='list-row';fields.forEach(f=>{const inp=document.createElement('input');inp.className='in';inp.placeholder=f;inp.value=item[Object.keys(item)[fields.indexOf(f)]]||'';inp.addEventListener('input',()=>{item[Object.keys(item)[fields.indexOf(f)]]=inp.value;markSave();});row.appendChild(inp);});const del=document.createElement('button');del.className='list-del';del.textContent='✕';del.onclick=()=>{state[key].splice(i,1);buildListEditor(id,key,fields,add);markSave();};row.appendChild(del);c.appendChild(row);});const add=document.createElement('button');add.className='list-add';add.textContent='+ '+add;add.onclick=()=>{state[key].push({});buildListEditor(id,key,fields,add);markSave();};c.appendChild(add);}
function fullRender(){renderStatic();renderPlanUI();applyPlanLocks();buildPaletteEditor();buildFontEditor();buildGalFields();buildListEditor('#ed-itin','itinerary',['time','name'],'momento');bindInputs();}
$('#btnExport').onclick=$('#btnExport2').onclick=()=>{const html=document.documentElement.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=slugify(state.name)+'.html';a.click();toast('✓ HTML descargado');};
$('#btnResetAll').onclick=()=>{state=makeDefaults();fullRender();markSave();toast('Restablecido');};
$('#btnUndo').onclick=()=>toast('↺ Deshacer');
$('#btnRedo').onclick=()=>toast('↻ Rehacer');
$('#btnHost').onclick=()=>toast('🌐 Slug: '+slugify(state.name));
$('#btnImport').onclick=()=>toast('⬆ Importar (demo)');
$('#planPill').onclick=()=>toast('Plan: '+PLANS[state.plan].name);
$$('.sec-head').forEach(h=>h.addEventListener('click',()=>{const s=h.parentElement;if(s.classList.contains('locked')){toast('🔒 Requiere plan superior');return;}s.classList.toggle('open');}));
fullRender();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Máquina de Garras</title>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  font-family:'Courier New',monospace;
  background:#06000f;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(ellipse at 20% 40%,rgba(120,40,200,.22) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 20%,rgba(0,180,220,.14) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 95%,rgba(240,50,120,.10) 0%,transparent 50%);
}

/* ── Outer wrapper — JS sets transform scale ── */
#root{
  position:absolute;top:50%;left:50%;
  transform-origin:top center;
  /* JS sets translate & scale */
}

/* ── Arcade cabinet ── */
.arcade{
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 0 48px rgba(140,50,255,.5));
  width:340px;
}

/* Header */
.cabinet-top{
  background:linear-gradient(150deg,#1a0535 0%,#091428 100%);
  border:2px solid #6d28d9;border-bottom:none;
  border-radius:14px 14px 0 0;
  padding:10px 16px;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.cabinet-title{
  color:#e879f9;font-size:9px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 12px #e879f9,0 0 28px #c026d3;white-space:nowrap;
}
.cabinet-title span{color:#fcd34d;text-shadow:0 0 12px #fcd34d}
.hud{display:flex;gap:8px}
.hud-item{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(0,0,0,.65);border:1px solid #6d28d9;
  border-radius:6px;padding:3px 12px;min-width:48px;
}
.hud-label{color:#7c3aed;font-size:5.5px;letter-spacing:2px;text-transform:uppercase}
.hud-value{color:#fcd34d;font-size:16px;font-weight:bold;line-height:1.3;text-shadow:0 0 8px #fcd34d;text-align:center}

/* Machine shell */
.machine-shell{
  background:linear-gradient(180deg,#110322 0%,#080f28 100%);
  border:2px solid #6d28d9;border-top:none;border-bottom:none;
  padding:8px 10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;
}
.collection-label{color:#6d28d9;font-size:6px;letter-spacing:2px;text-transform:uppercase;align-self:flex-start}
.collection-box{
  width:320px;height:46px;
  background:rgba(0,0,0,.45);border:1px solid #3b1a6e;border-radius:5px;
  display:flex;align-items:flex-end;justify-content:flex-start;
  overflow:hidden;gap:2px;padding:2px 4px;
}
@keyframes drop-in{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.col-canvas{animation:drop-in .4s forwards;image-rendering:pixelated}

.machine-wrap{
  position:relative;width:320px;height:340px;
  border:2px solid #4a1a2e;border-radius:4px;overflow:hidden;
  box-shadow:0 0 24px rgba(50,194,219,.25),inset 0 0 30px rgba(0,0,0,.4);
}
#gameCanvas{
  position:absolute;inset:0;width:320px;height:340px;
  image-rendering:pixelated;touch-action:none;
}
.machine-overlay{
  position:absolute;inset:0;
  background:rgba(50,194,219,.5);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:5;
}
.machine-overlay.flash{opacity:1}

/* Controls */
.cabinet-controls{
  background:linear-gradient(150deg,#1a0535 0%,#091428 100%);
  border:2px solid #6d28d9;border-top:1px solid #2e1065;
  border-radius:0 0 14px 14px;
  padding:12px 14px 16px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.status-msg{
  color:#a78bfa;font-size:8px;letter-spacing:2px;
  text-transform:uppercase;min-height:12px;text-align:center;
}

/* ── BIG touch buttons ── */
.control-row{display:flex;gap:8px;align-items:center;width:100%}
.game-btn{
  font-family:'Courier New',monospace;font-size:15px;font-weight:bold;letter-spacing:1px;
  border-radius:12px;border:3px solid transparent;
  cursor:not-allowed;opacity:.28;
  text-transform:uppercase;user-select:none;-webkit-user-select:none;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .12s,box-shadow .12s,transform .08s;
  display:flex;align-items:center;justify-content:center;
  flex:1;height:60px;
}
.game-btn.on{cursor:pointer;opacity:1}
.game-btn.on:active,.game-btn.pressing{transform:scale(.9)!important}

.btn-lr{background:#0e2050;border-color:#1d4ed8;color:#60a5fa}
.btn-lr.on{background:#1e3a8a;border-color:#60a5fa;color:#bfdbfe;
  box-shadow:0 0 16px rgba(37,99,235,.7),inset 0 0 10px rgba(37,99,235,.25)}

.btn-drop{background:#3a0818;border-color:#9f1239;color:#fb7185;flex:1.3}
.btn-drop.on{background:#881337;border-color:#f43f5e;color:#ffe4e6;
  box-shadow:0 0 16px rgba(244,63,94,.7),inset 0 0 10px rgba(244,63,94,.25)}

/* hint — hidden on very small screens */
.kbd-hint{color:#2e3748;font-size:7px;letter-spacing:1px;text-align:center}
@media(max-height:600px){.kbd-hint{display:none}}

/* ── Joystick zone hint on canvas ── */
.touch-hint{
  position:absolute;bottom:6px;left:0;right:0;
  color:rgba(255,255,255,.25);font-size:8px;letter-spacing:1px;
  text-align:center;font-family:'Courier New',monospace;
  pointer-events:none;
}

/* ── Win banner ── */
.win-banner{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.85);align-items:center;justify-content:center;
}
.win-banner.show{display:flex}
.win-card{
  background:#06000f;border:3px solid #fcd34d;border-radius:20px;
  padding:30px 44px;text-align:center;
  animation:win-pop .35s cubic-bezier(.34,1.56,.64,1) forwards;
  box-shadow:0 0 60px rgba(252,211,77,.45);
}
@keyframes win-pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.win-emoji{font-size:52px;margin-bottom:8px}
.win-title{color:#fcd34d;font-size:22px;font-weight:bold;letter-spacing:4px;text-shadow:0 0 20px #fcd34d;text-transform:uppercase}
.win-sub{color:#a78bfa;font-size:11px;letter-spacing:2px;margin-top:8px}
.win-close{
  background:#fcd34d;color:#000;border:none;border-radius:10px;
  padding:12px 32px;font-family:'Courier New',monospace;font-size:13px;
  font-weight:bold;letter-spacing:2px;cursor:pointer;margin-top:16px;
  text-transform:uppercase;transition:transform .1s;display:block;width:100%;
}
.win-close:active{transform:scale(.94)}

/* ── Brand logo ── */
.brand-logo{
  width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:6px 0 2px;
  border-top:1px solid rgba(109,40,217,.3);
  margin-top:2px;
}
.brand-logo img{
  width:180px;
  filter:brightness(1.8) sepia(.1) saturate(1.2);
  opacity:.95;
  transition:opacity .2s;
}
.brand-logo img:hover{opacity:1;}
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:300;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);
}
</style>
</head>
<body>
<div class="scanlines"></div>

<div class="win-banner" id="winBanner">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <div class="win-title">¡Premio!</div>
    <div class="win-sub" id="winSub">Has atrapado un juguete</div>
    <button class="win-close" id="winClose">CONTINUAR</button>
  </div>
</div>

<div id="root">
<div class="arcade">
  <div class="cabinet-top">
    <div class="cabinet-title">🕹 Máquina de <span>Garras</span></div>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Premios</span><span class="hud-value" id="scoreVal">0</span></div>
      <div class="hud-item"><span class="hud-label">Intentos</span><span class="hud-value" id="attemptsVal">0</span></div>
    </div>
  </div>
  <div class="machine-shell">
    <span class="collection-label">Mis premios</span>
    <div class="collection-box" id="collectionBox"></div>
    <div class="machine-wrap">
      <canvas id="gameCanvas" width="320" height="340"></canvas>
      <div class="machine-overlay" id="overlay"></div>
      <div class="touch-hint" id="touchHint">desliza en la pantalla para mover</div>
    </div>
  </div>
  <div class="cabinet-controls">
    <div class="status-msg" id="statusMsg">Iniciando...</div>
    <div class="control-row">
      <button class="game-btn btn-lr"   id="btnLeft">◀</button>
      <button class="game-btn btn-drop" id="btnDrop">▼ BAJAR</button>
      <button class="game-btn btn-lr"   id="btnRight">▶</button>
    </div>
    <div class="kbd-hint">⌨ ← → mover · Espacio bajar</div>
    <div class="brand-logo">
      <img src="https://hercules-cdn.com/file_xPMTRZF1ONJ61N1oPtXyysCn" alt="Gueka Ideas" />
    </div>
  </div>
</div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   MÁQUINA DE GARRAS  ·  mobile-first canvas game
══════════════════════════════════════════════════════ */

/* ── Scale to fit viewport ─────────────────────────── */
const root = document.getElementById('root');
function scaleToFit(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const naturalW = 340;
  // Measure full arcade height after layout
  const naturalH = root.scrollHeight || 640;
  const scaleW = vw / naturalW;
  const scaleH = vh / naturalH;
  const scale  = Math.min(scaleW, scaleH, 1.6); // cap at 1.6×
  const tx = (vw - naturalW * scale) / 2;
  const ty = Math.max(0, (vh - naturalH * scale) / 2);
  root.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  root.style.transformOrigin = 'top left';
  root.style.top = '0';
  root.style.left = '0';
}
window.addEventListener('resize', scaleToFit);
// Run after first paint + after logo loads
requestAnimationFrame(()=>{ requestAnimationFrame(scaleToFit); });
document.querySelector('.brand-logo img').addEventListener('load', scaleToFit);

/* ── Canvas + dimensions ───────────────────────────── */
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W=320, H=340;

/* ── Layout zones ───────────────────────────────────── */
const RAIL_Y  = 38;
const PLAY_Y0 = 50;
const SLOT_Y  = 286;
const FLOOR_H = H - SLOT_Y;

/* ── Claw limits ────────────────────────────────────── */
const X_MIN    = 20;
const X_MAX    = W - 24;
const ARM_REST = 24;
const ARM_MAX  = SLOT_Y - RAIL_Y - 22;

/* ── Speeds ─────────────────────────────────────────── */
const SPD_CLAW   = 3;
const SPD_ARM    = 3.5;
const SPD_RETURN = 4;

/* ── Toy catalogue ──────────────────────────────────── */
const TOYS = [
  { name:'Osito',    key:'bear',    hw:22, hh:28 },
  { name:'Conejito', key:'bunny',   hw:20, hh:30 },
  { name:'Pingüino', key:'penguin', hw:22, hh:22 },
  { name:'Robot',    key:'robot',   hw:20, hh:30 },
  { name:'Estrella', key:'star',    hw:22, hh:22 },
  { name:'Corazón',  key:'heart',   hw:20, hh:18 },
  { name:'Catarina', key:'bug',     hw:20, hh:18 },
];

/* ── Draw functions ─────────────────────────────────── */
function drawBear(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle='#c8855e';
  c.fillRect(-11,-13,8,8);c.fillRect(3,-13,8,8);
  c.fillStyle='#e8a87c';
  c.fillRect(-9,-11,4,4);c.fillRect(5,-11,4,4);
  c.fillStyle='#c8855e';c.beginPath();c.ellipse(0,-3,11,9,0,0,Math.PI*2);c.fill();
  c.fillStyle='#e8a87c';c.beginPath();c.ellipse(0,1,6,5,0,0,Math.PI*2);c.fill();
  c.fillStyle=hi?'#ff4466':'#222';
  c.fillRect(-5,-6,4,4);c.fillRect(1,-6,4,4);
  c.fillStyle='#222';c.fillRect(-2,2,4,2);
  c.fillStyle='#c8855e';c.fillRect(-9,6,18,14);
  c.fillStyle='#e8a87c';c.fillRect(-5,7,10,10);
  c.fillStyle='#c8855e';
  c.fillRect(-14,6,7,10);c.fillRect(7,6,7,10);
  c.fillRect(-8,20,7,5);c.fillRect(1,20,7,5);
  c.restore();
}
function drawBunny(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle='#f0d0d0';
  c.fillRect(-8,-24,6,18);c.fillRect(2,-24,6,18);
  c.fillStyle='#f08080';
  c.fillRect(-6,-22,2,14);c.fillRect(4,-22,2,14);
  c.fillStyle='#f0d0d0';c.beginPath();c.ellipse(0,-4,9,8,0,0,Math.PI*2);c.fill();
  c.fillStyle=hi?'#ff4466':'#222';
  c.fillRect(-5,-6,3,3);c.fillRect(2,-6,3,3);
  c.fillStyle='#f08080';c.fillRect(-1,0,2,2);
  c.fillStyle='#f0d0d0';c.fillRect(-8,4,16,14);
  c.fillStyle='#fff';c.beginPath();c.ellipse(7,7,4,4,0,0,Math.PI*2);c.fill();
  c.restore();
}
function drawPenguin(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle='#222';
  c.fillRect(-11,-8,22,22);c.fillRect(-9,-18,18,14);
  c.fillStyle='#fff';c.fillRect(-6,-6,12,18);
  c.fillStyle=hi?'#ff4466':'#fff';
  c.fillRect(-6,-15,4,4);c.fillRect(2,-15,4,4);
  c.fillStyle='#222';c.fillRect(-2,-12,4,2);
  c.fillStyle='#ffa500';
  c.fillRect(-3,-7,6,4);
  c.fillRect(-10,14,7,5);c.fillRect(3,14,7,5);
  c.restore();
}
function drawRobot(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle='#888';c.fillRect(-1,-22,2,8);
  c.fillStyle='#f00';c.fillRect(-3,-24,6,5);
  c.fillStyle='#7ec8d4';c.fillRect(-10,-15,20,16);
  c.fillStyle=hi?'#ff4444':'#00ffcc';
  c.fillRect(-7,-12,6,6);c.fillRect(1,-12,6,6);
  c.fillStyle='#333';c.fillRect(-4,-3,8,2);
  c.fillStyle='#5aa0b0';c.fillRect(-10,1,20,18);
  c.fillStyle='#222';c.fillRect(-7,4,14,9);
  c.fillStyle='#f00';c.fillRect(-5,6,4,4);
  c.fillStyle='#0f0';c.fillRect(1,6,4,4);
  c.fillStyle='#5aa0b0';
  c.fillRect(-14,1,6,12);c.fillRect(8,1,6,12);
  c.fillRect(-8,19,6,5);c.fillRect(2,19,6,5);
  c.restore();
}
function drawStar(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle=hi?'#ff9900':'#ffd700';
  c.beginPath();
  for(let i=0;i<5;i++){
    const a=i*Math.PI*0.4-Math.PI/2, b=a+Math.PI*0.2;
    i===0?c.moveTo(Math.cos(a)*11,Math.sin(a)*11):c.lineTo(Math.cos(a)*11,Math.sin(a)*11);
    c.lineTo(Math.cos(b)*5,Math.sin(b)*5);
  }
  c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(-3,-3,3,0,Math.PI*2);c.fill();
  c.restore();
}
function drawHeart(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle=hi?'#ff0055':'#ff6b9d';
  c.beginPath();
  c.moveTo(0,8);
  c.bezierCurveTo(-11,2,-13,-9,-4,-9);
  c.bezierCurveTo(0,-9,0,-5,0,-5);
  c.bezierCurveTo(0,-5,0,-9,4,-9);
  c.bezierCurveTo(13,-9,11,2,0,8);
  c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.ellipse(-3,-4,3,2,-.4,0,Math.PI*2);c.fill();
  c.restore();
}
function drawBug(c,cx,cy,sc,hi){
  c.save();c.translate(cx,cy);c.scale(sc,sc);
  c.fillStyle=hi?'#ff2200':'#e83030';
  c.beginPath();c.ellipse(0,2,9,10,0,0,Math.PI*2);c.fill();
  c.fillStyle='#111';c.fillRect(-1,-10,2,10);
  for(let i=0;i<3;i++){c.beginPath();c.arc(-4+i*4,4,2.5,0,Math.PI*2);c.fill();}
  c.fillStyle='#111';c.beginPath();c.ellipse(0,-9,7,7,0,0,Math.PI*2);c.fill();
  c.fillStyle=hi?'#ffcc00':'#fff';
  c.beginPath();c.arc(-3,-8,2.5,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(3,-8,2.5,0,Math.PI*2);c.fill();
  c.restore();
}

const DRAW_FNS = {bear:drawBear,bunny:drawBunny,penguin:drawPenguin,robot:drawRobot,star:drawStar,heart:drawHeart,bug:drawBug};

/* ── State ──────────────────────────────────────────── */
let phase   = 'init';
let jointX  = X_MIN;
let armH    = ARM_REST;
let score   = 0;
let attempts= 0;
let holdL   = false;
let holdR   = false;
let grabbed = null;
let blinkT  = 0;
let initT   = 0;

/* ── Toys ───────────────────────────────────────────── */
const toys = [];
function spawnToys(){
  const pool=[...TOYS,...TOYS].sort(()=>Math.random()-.5);
  const cols=4,rows=3;
  const cW=(X_MAX-X_MIN)/cols, cH=(SLOT_Y-PLAY_Y0-20)/rows;
  let i=0;
  for(let r=0;r<rows;r++){
    for(let co=0;co<cols;co++){
      if(i>=10) break;
      const def=pool[i];
      toys.push({
        def,
        x: X_MIN+co*cW+cW/2+(Math.random()*14-7),
        y: PLAY_Y0+10+r*cH+cH/2+(Math.random()*10-5),
        alive:true,selected:false,grabbed:false
      });
      i++;
    }
  }
}

/* ── Hit test ───────────────────────────────────────── */
function findToy(){
  const cx=jointX, cy=RAIL_Y+armH+20;
  const hitR=22;
  let best=null,bestD=Infinity;
  for(const t of toys){
    if(!t.alive) continue;
    const dx=t.x-cx,dy=t.y-cy;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<hitR+Math.max(t.def.hw,t.def.hh)*0.7&&d<bestD){bestD=d;best=t;}
  }
  return best;
}

/* ── DOM refs ───────────────────────────────────────── */
const elScore    = document.getElementById('scoreVal');
const elAttempts = document.getElementById('attemptsVal');
const elStatus   = document.getElementById('statusMsg');
const elWin      = document.getElementById('winBanner');
const elWinSub   = document.getElementById('winSub');
const elWinClose = document.getElementById('winClose');
const elColl     = document.getElementById('collectionBox');
const elOverlay  = document.getElementById('overlay');
const elTouchHint= document.getElementById('touchHint');
const btnLeft    = document.getElementById('btnLeft');
const btnRight   = document.getElementById('btnRight');
const btnDrop    = document.getElementById('btnDrop');

const setStatus = m => elStatus.textContent=m;
function setIdle(){btnLeft.classList.add('on');btnRight.classList.add('on');btnDrop.classList.add('on');}
function clearBtns(){btnLeft.classList.remove('on');btnRight.classList.remove('on');btnDrop.classList.remove('on');}

/* ── Collect ────────────────────────────────────────── */
function collectToy(toy){
  toy.alive=false;toy.selected=false;
  score++;elScore.textContent=score;
  const mini=document.createElement('canvas');
  mini.width=36;mini.height=42;mini.className='col-canvas';
  mini.style.imageRendering='pixelated';
  const mc=mini.getContext('2d');
  mc.save();mc.translate(18,22);
  DRAW_FNS[toy.def.key](mc,0,0,1.3,false);
  mc.restore();
  elColl.appendChild(mini);
  elOverlay.classList.add('flash');
  setTimeout(()=>elOverlay.classList.remove('flash'),350);
  elWinSub.textContent=`¡Atrapaste un ${toy.def.name}!`;
  setTimeout(()=>{phase='win';setStatus('¡Premio conseguido!');elWin.classList.add('show');},350);
}

elWinClose.addEventListener('click',()=>{
  elWin.classList.remove('show');
  jointX=X_MIN;armH=ARM_REST;grabbed=null;
  phase='idle';setStatus('Mueve la garra y baja');setIdle();
});

/* ── Drop ───────────────────────────────────────────── */
function triggerDrop(){
  if(phase!=='idle') return;
  attempts++;elAttempts.textContent=attempts;
  phase='dropping';clearBtns();
  setStatus('Bajando la garra...');
}

/* ── Update ─────────────────────────────────────────── */
function update(){
  if(phase==='init'){
    if(++initT>25){phase='idle';setStatus('Mueve la garra y baja');setIdle();}
    return;
  }
  if(phase==='idle'){
    if(holdL) jointX=Math.max(X_MIN,jointX-SPD_CLAW);
    if(holdR) jointX=Math.min(X_MAX,jointX+SPD_CLAW);
    return;
  }
  if(phase==='dropping'){
    armH=Math.min(armH+SPD_ARM,ARM_MAX);
    const hit=findToy();
    if(hit){
      grabbed=hit;grabbed.grabbed=true;
      setStatus('¡Atrapado! Subiendo...');phase='retracting';
    } else if(armH>=ARM_MAX){
      setStatus('Sin suerte... regresando');phase='retracting';
    }
    return;
  }
  if(phase==='retracting'){
    armH=Math.max(armH-SPD_ARM,ARM_REST);
    if(grabbed){grabbed.y=RAIL_Y+armH+16;grabbed.x=jointX;}
    if(armH<=ARM_REST){phase='returning';setStatus('Regresando...');}
    return;
  }
  if(phase==='returning'){
    const d=X_MIN-jointX;
    if(Math.abs(d)>SPD_RETURN){
      jointX+=Math.sign(d)*SPD_RETURN;
      if(grabbed)grabbed.x=jointX;
    } else {
      jointX=X_MIN;if(grabbed)grabbed.x=X_MIN;phase='releasing';
    }
    return;
  }
  if(phase==='releasing'){
    if(grabbed){
      const tY=SLOT_Y-grabbed.def.hh-4;
      if(grabbed.y<tY){grabbed.y=Math.min(grabbed.y+SPD_RETURN*2,tY);}
      else {
        grabbed.grabbed=false;grabbed.selected=true;
        const t=grabbed;grabbed=null;
        phase='idle';setIdle();
        setStatus('¡Toca el juguete para recogerlo!');
      }
    } else {phase='idle';setIdle();setStatus('Mueve la garra y baja');}
    return;
  }
}

/* ── Render ─────────────────────────────────────────── */
function render(){
  ctx.clearRect(0,0,W,H);
  // Rail zone bg
  const rg=ctx.createLinearGradient(0,0,0,PLAY_Y0);
  rg.addColorStop(0,'#143050');rg.addColorStop(1,'#1e5080');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,PLAY_Y0);
  // Play zone
  const pg=ctx.createLinearGradient(0,PLAY_Y0,0,SLOT_Y);
  pg.addColorStop(0,'#4ab0cc');pg.addColorStop(1,'#72cce8');
  ctx.fillStyle=pg;ctx.fillRect(0,PLAY_Y0,W,SLOT_Y-PLAY_Y0);
  // Floor
  ctx.fillStyle='#b8e8f4';ctx.fillRect(0,SLOT_Y,W,FLOOR_H);
  // Right wall
  ctx.fillStyle='#32c2db';ctx.fillRect(W-14,PLAY_Y0,14,H-PLAY_Y0);
  // Divider bar
  ctx.fillStyle='#57280f';ctx.fillRect(0,PLAY_Y0-4,W,6);
  // Slot opening
  ctx.fillStyle='#57280f';ctx.fillRect(0,SLOT_Y-3,50,6);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(1,SLOT_Y+2,46,FLOOR_H-6);

  // Toys
  blinkT++;
  for(const t of toys){
    if(!t.alive) continue;
    if(t.selected){
      if(Math.floor(blinkT/8)%2===0){
        ctx.save();
        ctx.strokeStyle='#fcd34d';ctx.lineWidth=2.5;ctx.setLineDash([5,3]);
        ctx.strokeRect(t.x-t.def.hw-6,t.y-t.def.hh-6,t.def.hw*2+12,t.def.hh*2+12);
        ctx.setLineDash([]);
        ctx.restore();
      }
      ctx.fillStyle='rgba(252,211,77,.95)';
      ctx.font='bold 10px sans-serif';ctx.textAlign='center';
      ctx.fillText('👆 TAP',t.x,t.y-t.def.hh-10);
    }
    DRAW_FNS[t.def.key](ctx,t.x,t.y,1,t.grabbed||t.selected);
  }

  // Rail
  ctx.fillStyle='#cceeff';ctx.fillRect(0,RAIL_Y-3,W-14,6);
  ctx.strokeStyle='#33a5da';ctx.lineWidth=2;ctx.strokeRect(0,RAIL_Y-4,W-14,8);
  // Vertical rod
  ctx.fillStyle='#ddeeff';ctx.fillRect(jointX-4,0,8,RAIL_Y+3);
  ctx.strokeStyle='#33a5da';ctx.lineWidth=1.5;ctx.strokeRect(jointX-4,0,8,RAIL_Y+3);
  // Joint
  ctx.fillStyle='#fff';ctx.strokeStyle='#33a5da';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(jointX,RAIL_Y,7,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Arm
  const armBot=RAIL_Y+armH;
  ctx.fillStyle='#ddeeff';ctx.fillRect(jointX-4,RAIL_Y+7,8,armH-7);
  ctx.strokeStyle='#33a5da';ctx.lineWidth=2;ctx.strokeRect(jointX-4,RAIL_Y+7,8,armH-7);
  // Claws
  const open=(phase==='dropping'||phase==='retracting');
  drawClaws(jointX,armBot,open);
}

function drawClaws(cx,cy,open){
  ctx.strokeStyle='#33a5da';ctx.lineWidth=3;ctx.lineCap='round';
  const sp=open?16:6;
  ctx.beginPath();ctx.moveTo(cx-3,cy);ctx.quadraticCurveTo(cx-sp,cy+8,cx-sp-2,cy+20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+3,cy);ctx.quadraticCurveTo(cx+sp,cy+8,cx+sp+2,cy+20);ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-4,cy);ctx.lineTo(cx+4,cy);ctx.stroke();
  if(open){ctx.fillStyle='rgba(51,165,218,.18)';ctx.beginPath();ctx.arc(cx,cy+10,18,0,Math.PI*2);ctx.fill();}
}

/* ── RAF loop ───────────────────────────────────────── */
function loop(){requestAnimationFrame(loop);update();render();}

/* ══════════════════════════════════════════════════════
   INPUT HANDLING
══════════════════════════════════════════════════════ */

/* ── Canvas: tap to collect + swipe to move ─────────── */
let dragStartX = null;
let dragStartJointX = null;
let isDragging = false;
const DRAG_THRESHOLD = 5; // px to start considering it a drag

// Helper: canvas-local coords accounting for CSS scale
function canvasCoords(e){
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width;
  const scaleY = H / r.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - r.left) * scaleX,
    y: (src.clientY - r.top)  * scaleY
  };
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const {x} = canvasCoords(e);
  dragStartX = x;
  dragStartJointX = jointX;
  isDragging = false;
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(phase!=='idle') return;
  const {x} = canvasCoords(e);
  const dx = x - dragStartX;
  if(Math.abs(dx) > DRAG_THRESHOLD) isDragging = true;
  if(isDragging){
    jointX = Math.max(X_MIN, Math.min(X_MAX, dragStartJointX + dx));
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  if(!isDragging && phase==='idle'){
    // It was a tap — check if on a selected toy
    const {x:mx,y:my} = canvasCoords(e);
    for(const t of toys){
      if(!t.alive||!t.selected) continue;
      if(Math.abs(mx-t.x)<t.def.hw+12&&Math.abs(my-t.y)<t.def.hh+12){
        collectToy(t); return;
      }
    }
  }
  isDragging=false; dragStartX=null;
},{passive:false});

canvas.addEventListener('click',e=>{
  if(phase!=='idle') return;
  const {x:mx,y:my} = canvasCoords(e);
  for(const t of toys){
    if(!t.alive||!t.selected) continue;
    if(Math.abs(mx-t.x)<t.def.hw+12&&Math.abs(my-t.y)<t.def.hh+12){
      collectToy(t); return;
    }
  }
});

/* ── Buttons ────────────────────────────────────────── */
function bindHold(btn,onStart,onStop){
  btn.addEventListener('mousedown', e=>{e.preventDefault();btn.classList.add('pressing');onStart();});
  btn.addEventListener('touchstart',e=>{e.preventDefault();btn.classList.add('pressing');onStart();},{passive:false});
  const stop=()=>{btn.classList.remove('pressing');onStop();};
  btn.addEventListener('mouseup',   e=>{e.preventDefault();stop();});
  btn.addEventListener('mouseleave',stop);
  btn.addEventListener('touchend',  e=>{e.preventDefault();stop();});
  btn.addEventListener('touchcancel',stop);
}
bindHold(btnLeft, ()=>{if(phase==='idle')holdL=true;}, ()=>holdL=false);
bindHold(btnRight,()=>{if(phase==='idle')holdR=true;}, ()=>holdR=false);

function bindTap(btn,fn){
  btn.addEventListener('mousedown', e=>{e.preventDefault();btn.classList.add('pressing');fn();});
  btn.addEventListener('touchstart',e=>{e.preventDefault();btn.classList.add('pressing');fn();},{passive:false});
  const up=()=>btn.classList.remove('pressing');
  btn.addEventListener('mouseup',  e=>{e.preventDefault();up();});
  btn.addEventListener('touchend', e=>{e.preventDefault();up();});
}
bindTap(btnDrop,triggerDrop);

/* ── Keyboard ───────────────────────────────────────── */
const keysHeld=new Set();
document.addEventListener('keydown',e=>{
  if(keysHeld.has(e.code)) return;
  keysHeld.add(e.code);
  if(e.code==='ArrowLeft' ||e.code==='KeyA'){e.preventDefault();if(phase==='idle')holdL=true;}
  if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();if(phase==='idle')holdR=true;}
  if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();triggerDrop();}
});
document.addEventListener('keyup',e=>{
  keysHeld.delete(e.code);
  if(e.code==='ArrowLeft' ||e.code==='KeyA') holdL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') holdR=false;
});

/* ── Hide touch hint after first move ──────────────── */
let hintShown=true;
canvas.addEventListener('touchstart',()=>{
  if(hintShown){hintShown=false;elTouchHint.style.opacity='0';}
},{once:true});

/* ── Boot ───────────────────────────────────────────── */
spawnToys();
loop();
</script>

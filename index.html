<head>

<link href="https://cdn.jsdelivr.net/npm/@fontsource/figtree/600.css" rel="stylesheet">

<style>
/* ═══ GUEKA IDEAS · ESTUDIO (marfil·verde·oro) ═══ */
*{margin:0;padding:0;box-sizing:border-box}
:root{--e-bg:#f6f7f4;--e-panel:#fff;--e-line:#e4e8e2;--e-ink:#16211b;--e-mut:#6d7a72;--e-green:#1e4d38;--e-gold:#b89b5e;--e-sage:#eef1ec;--e-red:#a3403f;--fd:'Marcellus',Georgia,serif;--fb:'Figtree',system-ui,sans-serif;--sh:0 22px 55px rgba(22,33,27,.10)}
html,body{height:100%}
body{font-family:var(--fb);background:var(--e-bg);color:var(--e-ink);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--e-line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:30}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:38px}
.brand b{font-family:var(--fd);letter-spacing:.14em;font-size:14px;color:var(--e-green)}
.sel{background:#fff;border:1px solid var(--e-line);border-radius:8px;font:inherit;font-size:11px;padding:7px 9px;max-width:160px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--e-gold);border-radius:999px;font-size:10px;font-weight:700;color:var(--e-gold);background:rgba(184,155,94,.08);cursor:pointer}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-dot{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--e-mut)}
.save-dot i{width:7px;height:7px;border-radius:50%;background:var(--e-green)}
.btn{font:inherit;font-size:11px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--e-line);background:#fff;color:var(--e-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.solid{background:var(--e-green);color:#fff;border-color:var(--e-green)}
.workspace{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.preview-wrap{position:relative;overflow:hidden;background:radial-gradient(700px 500px at 20% 10%,rgba(184,155,94,.1),transparent 60%),#eef1ec}
.stage-tag{position:absolute;top:14px;left:16px;z-index:20;font-size:9px;letter-spacing:.24em;color:var(--e-mut);text-transform:uppercase}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:15}
.empty-card{background:#fff;border:1px solid var(--e-line);border-radius:16px;padding:2rem;text-align:center;box-shadow:var(--sh);max-width:320px}
.empty-card h3{font-family:var(--fd);color:var(--e-green);margin-bottom:.5rem}
.empty-card p{font-size:.8rem;color:var(--e-mut);margin-bottom:1rem}
#iframeCard{position:absolute;inset:0;width:100%;height:100%;border:0}
.sidebar{overflow-y:auto;border-left:1px solid var(--e-line);background:var(--e-panel)}
.panel-head{position:sticky;top:0;z-index:5;padding:14px 18px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--e-line)}
.panel-head strong{font-family:var(--fd);font-size:13px;letter-spacing:.14em;color:var(--e-green)}
.plan-bar{padding:12px 14px;border-bottom:1px solid var(--e-line);background:#fff}
.plan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.plan-card{border:1px solid var(--e-line);border-radius:12px;padding:10px 6px;background:#fff;cursor:pointer;text-align:center;font:inherit}
.plan-card.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.plan-card .n{font-size:8.5px;font-weight:700;letter-spacing:.12em}
.plan-card .p{font-size:10px;font-weight:700;margin-top:3px;font-family:var(--fd)}
.sec{border-bottom:1px solid var(--e-line)}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 18px;background:none;border:0;color:var(--e-ink);cursor:pointer;font:inherit;text-align:left}
.sec-num{font-family:var(--fd);font-size:12px;color:var(--e-gold)}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.sec-head .chev{margin-left:auto;transition:transform .3s;color:var(--e-mut)}
.sec.open .chev{transform:rotate(180deg)}
.sec-lock{margin-left:auto;font-size:8px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid}
.sec-lock.req-premium{color:var(--e-gold);border-color:rgba(184,155,94,.5)}
.sec-lock.req-deluxe{color:var(--e-green);border-color:rgba(30,77,56,.4)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.sec.open .sec-body{grid-template-rows:1fr}
.sec.locked .sec-body{display:none}
.sec-inner{overflow:hidden}
.sec-pad{padding:6px 18px 18px}
.field{margin-bottom:11px}
.field label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--e-mut);margin-bottom:5px}
.in{width:100%;font:inherit;font-size:12px;background:#fff;border:1px solid var(--e-line);border-radius:9px;padding:9px 11px}
textarea.in{resize:vertical;min-height:50px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.list-row{position:relative;border:1px solid var(--e-line);border-radius:10px;padding:10px 40px 10px 10px;margin-bottom:9px;background:#fff}
.list-row .in{margin-bottom:7px}
.list-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border:0;border-radius:6px;cursor:pointer;background:#f8efee;color:var(--e-red)}
.list-add{width:100%;font:inherit;font-size:10px;font-weight:700;padding:9px;border:1px dashed rgba(184,155,94,.6);border-radius:9px;background:rgba(184,155,94,.06);color:var(--e-gold);cursor:pointer}
.photo-field{margin-bottom:14px}
.photo-field label{display:block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--e-mut);margin-bottom:6px}
.photo-preview-wrap{height:80px;border-radius:10px;overflow:hidden;border:1px solid var(--e-line);margin-bottom:6px}
.photo-preview-wrap img{width:100%;height:100%;object-fit:cover;object-position:top}
.photo-tools{display:flex;gap:6px;margin-top:6px}
.photo-tool{flex:1;font-size:9px;padding:6px;border-radius:7px;cursor:pointer;border:1px solid var(--e-line);background:#fff;font-weight:600}
.gal-note{font-size:8px;color:var(--e-gold);margin-top:4px;font-weight:700}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--e-ink);border:1px solid var(--e-gold);color:#fff;font-size:12px;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.35s}
.toast.show{opacity:1;transform:none}
@media(max-width:1024px){.workspace{display:block;position:relative}.preview-wrap{position:absolute;inset:0}.sidebar{position:absolute;top:0;bottom:0;right:0;width:min(400px,92vw);transform:translateX(100%);transition:.35s;z-index:200}.sidebar.mob-open{transform:none}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand"><img src="https://hercules-cdn.com/file_GksORuRQPAzOYyo4c4ClTi44" alt="Gueka Ideas"><b>GUEKA IDEAS · ESTUDIO</b></div>
<select class="sel" id="catSelect"></select>
<select class="sel" id="tplSelect"></select>
<button class="pill" id="planPill">✦ <span id="planPillTxt">CLASSIC</span></button>
<div class="top-actions">
<span class="save-dot" id="saveDot"><i></i><span id="saveTxt">Guardado</span></span>
<button class="btn" id="btnQR">QR</button>
<button class="btn solid" id="btnExport">⬇ HTML</button>
</div>
</header>
<div class="workspace">
<main class="preview-wrap">
<div class="stage-tag">VISTA PREVIA EN VIVO</div>
<div class="empty-state" id="emptyState"><div class="empty-card"><h3>Sin tarjeta cargada</h3><p>Elige una categoría y un diseño, o súbelo desde <b>disenos/</b>.</p><button class="btn solid" id="btnLoadFirst">Cargar primer diseño</button></div></div>
<iframe id="iframeCard" title="Tarjeta"></iframe>
</main>
<aside class="sidebar" id="sidebar">
<div class="panel-head"><strong>PANEL DE EDICIÓN · 15 SECCIONES</strong></div>
<div class="plan-bar"><div class="plan-cards" id="planCards"></div></div>

<!-- 01 CONTENIDO -->
<div class="sec open" data-sec="1"><button class="sec-head"><span class="sec-num">01</span><span class="sec-title">Contenido</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="row2"><div class="field"><label>Nombre</label><input class="in" data-bind="name"></div><div class="field"><label>Edad</label><input class="in" data-bind="age"></div></div>
<div class="row2"><div class="field"><label>Sufijo</label><input class="in" data-bind="ageSuffix"></div><div class="field"><label>Usuario</label><input class="in" data-bind="username"></div></div>
<div class="row2"><div class="field"><label>Fecha</label><input class="in" type="date" data-bind="date"></div><div class="field"><label>Hora</label><input class="in" type="time" data-bind="time"></div></div>
<div class="field"><label>Ubicación corta</label><input class="in" data-bind="locationShort"></div>
<div class="field"><label>Hashtag</label><input class="in" data-bind="hashtag"></div>
<div class="field"><label>Frase de portada</label><textarea class="in" data-bind="caption"></textarea></div>
<div class="field"><label>Cita destacada</label><textarea class="in" data-bind="quote"></textarea></div>
</div></div></div></div>

<!-- 02 FOTOS -->
<div class="sec" data-sec="2"><button class="sec-head"><span class="sec-num">02</span><span class="sec-title">Fotos</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="photo-field"><label>Retrato principal</label><div class="photo-preview-wrap"><img id="prev-retrato" src=""></div><input class="in" id="url-retrato" type="url"><div class="photo-tools"><button class="photo-tool" data-up="retrato">📁 Subir</button><button class="photo-tool" data-def="retrato">↺ Default</button></div></div>
<div class="photo-field"><label>Mi historia</label><div class="photo-preview-wrap"><img id="prev-fashion" src=""></div><input class="in" id="url-fashion" type="url"><div class="photo-tools"><button class="photo-tool" data-up="fashion">📁 Subir</button><button class="photo-tool" data-def="fashion">↺ Default</button></div></div>
<div class="field"><label>Galería (según plan)</label></div>
<div id="gal-fields"></div>
</div></div></div></div>

<!-- 03 BIENVENIDA -->
<div class="sec" data-sec="3"><button class="sec-head"><span class="sec-num">03</span><span class="sec-title">Bienvenida</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Texto del botón</label><input class="in" data-bind="splashBtn"></div>
<div class="field"><label>Pista inferior</label><input class="in" data-bind="splashHint"></div>
</div></div></div></div>

<!-- 04 MI HISTORIA (premium) -->
<div class="sec" data-sec="4" data-req="premium"><button class="sec-head"><span class="sec-num">04</span><span class="sec-title">Mi historia</span><span class="sec-lock req-premium">PREMIUM</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Etiqueta</label><input class="in" data-bind="historyTag"></div>
<div class="field"><label>Cita</label><textarea class="in" data-bind="historyQuote"></textarea></div>
<div class="field"><label>Biografía</label><textarea class="in" data-bind="historyText"></textarea></div>
</div></div></div></div>

<!-- 05 PROGRAMA (premium) -->
<div class="sec" data-sec="5" data-req="premium"><button class="sec-head"><span class="sec-num">05</span><span class="sec-title">Programa</span><span class="sec-lock req-premium">PREMIUM</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad"><div id="ed-itin"></div></div></div></div></div>

<!-- 06 PADRINOS (deluxe) -->
<div class="sec" data-sec="6" data-req="deluxe"><button class="sec-head"><span class="sec-num">06</span><span class="sec-title">Padrinos</span><span class="sec-lock req-deluxe">DELUXE</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad"><div id="ed-padr"></div></div></div></div></div>

<!-- 07 EL LUGAR (deluxe) -->
<div class="sec" data-sec="7" data-req="deluxe"><button class="sec-head"><span class="sec-num">07</span><span class="sec-title">El lugar</span><span class="sec-lock req-deluxe">DELUXE</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Nombre del salón</label><input class="in" data-bind="venue"></div>
<div class="field"><label>Dirección</label><textarea class="in" data-bind="address"></textarea></div>
<div class="field"><label>Enlace de mapa</label><input class="in" data-bind="mapUrl"></div>
</div></div></div></div>

<!-- 08 DRESS CODE -->
<div class="sec" data-sec="8"><button class="sec-head"><span class="sec-num">08</span><span class="sec-title">Dress code</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Intro</label><input class="in" data-bind="dressIntro"></div>
<div id="ed-dress"></div>
<div class="field"><label>Advertencia</label><input class="in" data-bind="dressWarn"></div>
</div></div></div></div>

<!-- 09 INFO EXTRA (deluxe) -->
<div class="sec" data-sec="9" data-req="deluxe"><button class="sec-head"><span class="sec-num">09</span><span class="sec-title">Info extra</span><span class="sec-lock req-deluxe">DELUXE</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad"><div id="ed-extra"></div></div></div></div></div>

<!-- 10 GALERÍA -->
<div class="sec" data-sec="10"><button class="sec-head"><span class="sec-num">10</span><span class="sec-title">Galería</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad"><div id="ed-gal"></div><div class="gal-note" id="galNote"></div></div></div></div></div>

<!-- 11 MÚSICA (premium) -->
<div class="sec" data-sec="11" data-req="premium"><button class="sec-head"><span class="sec-num">11</span><span class="sec-title">Música</span><span class="sec-lock req-premium">PREMIUM</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Intro</label><textarea class="in" data-bind="musicIntro"></textarea></div>
<div id="ed-songs"></div>
</div></div></div></div>

<!-- 12 REGALOS (deluxe) -->
<div class="sec" data-sec="12" data-req="deluxe"><button class="sec-head"><span class="sec-num">12</span><span class="sec-title">Regalos</span><span class="sec-lock req-deluxe">DELUXE</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad"><div id="ed-gifts"></div></div></div></div></div>

<!-- 13 CONFIRMACIÓN (premium) -->
<div class="sec" data-sec="13" data-req="premium"><button class="sec-head"><span class="sec-num">13</span><span class="sec-title">Confirmación</span><span class="sec-lock req-premium">PREMIUM</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Intro</label><textarea class="in" data-bind="rsvpIntro"></textarea></div>
<div class="row2"><div class="field"><label>Fecha límite</label><input class="in" data-bind="rsvpDeadline"></div><div class="field"><label>Aforo (0=∞)</label><input class="in" type="number" data-bind="rsvpCapacity"></div></div>
<div class="field"><label>WhatsApp organizadora</label><input class="in" data-bind="waOrganizer"></div>
</div></div></div></div>

<!-- 14 CIERRE -->
<div class="sec" data-sec="14"><button class="sec-head"><span class="sec-num">14</span><span class="sec-title">Cierre</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Poema</label><textarea class="in" data-bind="poem"></textarea></div>
<div class="field"><label>Firma</label><input class="in" data-bind="signature"></div>
</div></div></div></div>

<!-- 15 ESTILO -->
<div class="sec" data-sec="15"><button class="sec-head"><span class="sec-num">15</span><span class="sec-title">Estilo</span><span class="chev">▾</span></button>
<div class="sec-body"><div class="sec-inner"><div class="sec-pad">
<div class="field"><label>Paleta</label><select class="in" id="palSelect"><option value="neon">NEÓN TIKTOK</option><option value="violeta">VIOLETA</option><option value="dorado">DORADO</option><option value="oceano">OCÉANO</option></select></div>
</div></div></div></div>
</aside>
</div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad=n=>String(n).padStart(2,'0');
function toast(h){const t=document.createElement('div');t.className='toast';t.innerHTML=h;$('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},2600);}
const IMG_BASE2='https://image.qwenlm.ai/public_source/501fff7f-a609-4843-af5b-2ac3bc956c88/';
const IMG_BASE='https://image.qwenlm.ai/public_source/9a965b8a-caf8-4a45-bb09-dce792791ca0/';
const PLANS={classic:{name:'CLASSIC',price:80000,maxGal:4,color:'#6d7a72'},premium:{name:'PREMIUM',price:140000,maxGal:8,color:'#b89b5e'},deluxe:{name:'DELUXE',price:200000,maxGal:12,color:'#1e4d38'}};
const PLAN_ORDER=['classic','premium','deluxe'];
const REQ={4:'premium',5:'premium',11:'premium',13:'premium',6:'deluxe',7:'deluxe',9:'deluxe',12:'deluxe'};
const GAL_ORDER=['retrato','fashion','vals','pista','pastel','corte','baile','brindis','decoracion','sorpresa','amigas','final'];
const DEFAULT_IMGS={retrato:IMG_BASE2+'119aaf951-991f-48f5-bce6-7cf6bf499e4a.png',fashion:IMG_BASE2+'17d5b58f7-f052-4079-9919-eba1f0eb4faf.png',vals:'',pista:'',pastel:'',corte:'',baile:'',brindis:'',decoracion:'',sorpresa:'',amigas:'',final:''};
let state={plan:'classic',category:'quince',templateName:'',name:'Sofía Valentina',age:'15',ageSuffix:'AÑOS',username:'sofia.valentina.xv',date:'2026-06-20',time:'18:30',locationShort:'BOG · COL',hashtag:'#SofíaValentinaXV',caption:'✨ Mi gran noche llega...',quote:'"Esta noche la pista te pertenece."',splashBtn:'▶ ABRIR INVITACIÓN',splashHint:'TOCA PARA ENTRAR',historyTag:'FASHION · 2026',historyQuote:'"Dos grandes pasiones..."',historyText:'Sofía nació el 20 de junio de 2011.',venue:'SALÓN DE EVENTOS',address:'Calle de los Sueños 123',mapUrl:'https://maps.google.com',dressIntro:'Esta noche merece tu mejor versión.',dressWarn:'Evita el blanco puro.',musicIntro:'¿Qué canciones no pueden faltar?',rsvpIntro:'Tu presencia hará esta noche especial.',rsvpDeadline:'5 de Junio',rsvpCapacity:0,waOrganizer:'',poem:'Hoy comienzas a escribir\nel capítulo más hermoso.',signature:'Con amor, Sofía',palette:'neon',itinerary:[{time:'6:30 PM',name:'RECEPCIÓN',desc:'Bienvenida'},{time:'8:00 PM',name:'VALS',desc:'Primer vals'}],padrinos:[{cat:'VALS',name:'Familia Rodríguez'}],dressCode:[{title:'DAMAS',desc:'Vestido largo'},{title:'CABALLEROS',desc:'Traje formal'}],extra:[{icon:'📸',title:'FOTÓGRAFO',body:'Fotógrafo toda la noche'}],songs:[{title:'Vals Op.64 No.1',src:'https://archive.org/download/musopen-chopin/Waltz%20Op.%2064%20no.%201%20in%20D%20flat%20major.mp3'}],gifts:[{key:'nequi',label:'NEQUI',sub:'Colombia'}],captions:{},imgs:{...DEFAULT_IMGS}};
let designLoaded=false,currentDesign=null;
function planLevel(p){return PLAN_ORDER.indexOf(p);}
function has(f){return planLevel(state.plan)>=planLevel(f);}
function maxGal(){return PLANS[state.plan].maxGal;}
/* Plan UI + bloqueo de secciones */
function renderPlans(){const c=$('#planCards');c.innerHTML='';PLAN_ORDER.forEach(k=>{const p=PLANS[k];const b=document.createElement('button');b.className='plan-card'+(k===state.plan?' sel':'');b.style.setProperty('--pc',p.color);b.innerHTML='<div class="n">'+p.name+'</div><div class="p">$'+(p.price/1000)+'K</div>';b.onclick=()=>{state.plan=k;applyLocks();renderPlans();buildGalFields();pushData();save();};c.appendChild(b);});$('#planPillTxt').textContent=PLANS[state.plan].name;}
function applyLocks(){$$('.sec[data-req]').forEach(s=>{const r=s.dataset.req;const locked=!has(r);s.classList.toggle('locked',locked);if(locked)s.classList.remove('open');});}
/* Selectores */
const CATS={quince:'15 Años',matrimonio:'Matrimonio',bautizo:'Bautizo',comunion:'Comunión',cumpleanos:'Cumpleaños',graduacion:'Graduación',infantiles:'Infantiles',empresarial:'Empresarial'};
function buildCats(){const s=$('#catSelect');s.innerHTML='';Object.entries(CATS).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;s.appendChild(o);});s.value=state.category;}
async function loadTplList(){const cat=state.category;try{const m=await fetch('disenos/'+cat+'/manifest.json').then(r=>r.ok?r.json():null);const sel=$('#tplSelect');sel.innerHTML='';if(m&&m.disenos){m.disenos.forEach(d=>{const o=document.createElement('option');o.value=d.slug;o.textContent=d.nombre;sel.appendChild(o);});}else{const o=document.createElement('option');o.value='xv-tiktok-neon';o.textContent='XV TikTok Neón (integrada)';sel.appendChild(o);}}catch(e){const sel=$('#tplSelect');sel.innerHTML='<option value="xv-tiktok-neon">XV TikTok Neón (integrada)</option>';}}
async function loadDesign(slug){try{const base='disenos/'+state.category+'/'+slug+'/';const[html,css,js]=await Promise.all([fetch(base+'design.html').then(r=>{if(!r.ok)throw 0;return r.text()}),fetch(base+'design.css').then(r=>{if(!r.ok)throw 0;return r.text()}),fetch(base+'design.js').then(r=>{if(!r.ok)throw 0;return r.text()})]);currentDesign={html,css,js};mount();}catch(e){currentDesign=null;$('#emptyState').style.display='flex';$('#iframeCard').removeAttribute('srcdoc');designLoaded=false;}}
function mount(){designLoaded=true;$('#emptyState').style.display='none';const f=$('#iframeCard');f.srcdoc=currentDesign.html.replace('</head>','<style>'+currentDesign.css+'</style>'+'</head>').replace('</body>','<script>'+currentDesign.js+'<\/script></body>');f.onload=()=>pushData();}
function pushData(){if(!designLoaded)return;const f=$('#iframeCard');if(f.contentWindow)f.contentWindow.postMessage({type:'gk-data',data:Object.assign({},state,{maxGal:maxGal()})},'*');}
/* Datos / bindings */
function save(){const d=$('#saveDot');d.classList.add('saving');setTimeout(()=>d.classList.remove('saving'),600);try{localStorage.setItem('gueka_editor_15',JSON.stringify(state));}catch(e){}}
$$('[data-bind]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.bind]=el.value;pushData();save();}));
$('#palSelect').addEventListener('change',e=>{state.palette=e.target.value;pushData();save();});
/* Listas editables */
function listEditor(id,key,fields,add){const c=$(id);if(!c)return;c.innerHTML='';state[key].forEach((it,i)=>{const row=document.createElement('div');row.className='list-row';fields.forEach(f=>{const inp=document.createElement('input');inp.className='in';inp.placeholder=f;inp.value=it[Object.keys(it)[fields.indexOf(f)]]||'';inp.addEventListener('input',()=>{it[fields[fields.indexOf(f)]]=inp.value;pushData();save();});row.appendChild(inp);});const del=document.createElement('button');del.className='list-del';del.textContent='✕';del.onclick=()=>{state[key].splice(i,1);listEditor(id,key,fields,add);pushData();save();};row.appendChild(del);c.appendChild(row);});const a=document.createElement('button');a.className='list-add';a.textContent='+ '+add;a.onclick=()=>{const o={};fields.forEach(f=>o[f]='');state[key].push(o);listEditor(id,key,fields,add);pushData();save();};c.appendChild(a);}
function buildLists(){listEditor('ed-itin','itinerary',['time','name','desc'],'momento');listEditor('ed-padr','padrinos',['cat','name'],'padrino');listEditor('ed-dress','dressCode',['title','desc'],'ítem');listEditor('ed-extra','extra',['icon','title','body'],'ítem');listEditor('ed-songs','songs',['title','src'],'canción');listEditor('ed-gifts','gifts',['label','sub'],'método');buildCaptions();}
function buildCaptions(){const c=$('#ed-gal');c.innerHTML='';GAL_ORDER.slice(0,maxGal()).forEach(k=>{const row=document.createElement('div');row.className='list-row';row.style.paddingRight='10px';const inp=document.createElement('input');inp.className='in';inp.placeholder='Pie · '+k;inp.value=state.captions[k]||'';inp.addEventListener('input',()=>{state.captions[k]=inp.value;pushData();save();});row.appendChild(inp);c.appendChild(row);});$('#galNote').textContent='Mostrando '+maxGal()+' de '+GAL_ORDER.length+' fotos (plan '+PLANS[state.plan].name+').';}
function buildGalFields(){const c=$('#gal-fields');c.innerHTML='';GAL_ORDER.slice(0,maxGal()).forEach(k=>{const d=document.createElement('div');d.className='photo-field';d.innerHTML='<label>'+k+'</label><div class="photo-preview-wrap"><img id="prev-gal-'+k+'" src="'+(state.imgs[k]||'')+'"></div><input class="in" id="url-gal-'+k+'" type="url">';const inp=d.querySelector('input');inp.addEventListener('input',()=>{state.imgs[k]=inp.value;$('#prev-gal-'+k).src=inp.value;pushData();save();});c.appendChild(d);});}
/* Fotos subir */
$$('.photo-tool[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up;const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);state.imgs[k]=cv.toDataURL('image/jpeg',0.85);$('#prev-'+k).src=state.imgs[k];pushData();save();};img.src=rd.result;};rd.readAsDataURL(f);};fi.click();});
$$('.photo-tool[data-def]').forEach(b=>b.onclick=()=>{const k=b.dataset.def;state.imgs[k]=DEFAULT_IMGS[k]||'';$('#prev-'+k).src=state.imgs[k];pushData();save();});
/* Acordeón */
$$('.sec-head').forEach(h=>h.addEventListener('click',()=>{const s=h.parentElement;if(s.classList.contains('locked')){toast('🔒 Disponible en plan '+s.dataset.req.toUpperCase());return;}s.classList.toggle('open');}));
/* Export */
$('#btnExport').onclick=()=>{if(!designLoaded){toast('⚠ Carga un diseño primero');return;}const f=$('#iframeCard');const html=f.srcdoc;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='invitacion-'+(state.name||'evento').toLowerCase().replace(/\s+/g,'-')+'.html';a.click();toast('✓ HTML descargado');};
$('#btnQR').onclick=()=>{toast('QR generado para compartir');};
$('#btnLoadFirst').onclick=()=>loadDesign($('#tplSelect').value||'xv-tiktok-neon');
$('#catSelect').addEventListener('change',e=>{state.category=e.target.value;loadTplList();});
$('#tplSelect').addEventListener('change',e=>loadDesign(e.target.value));
/* Init */
buildCats();renderPlans();applyLocks();buildLists();buildGalFields();
try{const s=localStorage.getItem('gueka_editor_15');if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
loadTplList();
</script>
</body>
</html>
